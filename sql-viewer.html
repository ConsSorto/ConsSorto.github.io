<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsDev Lab - SQL a Diagrama ER</title>
    <style>
        :root { 
            --bg-dark: #0f172a; 
            --panel-bg: #1e293b; 
            --text: #f1f5f9; 
            --accent: #a78bfa;
            --btn-bg: #334155;
            --btn-hover: #475569;
        }
        body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
        
        .header { 
            background-color: var(--panel-bg); 
            padding: 10px 20px; 
            border-bottom: 1px solid #334155; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
        }
        .title { font-size: 14px; font-weight: bold; color: var(--accent); text-transform: uppercase; }
        .status { font-size: 11px; color: #94a3b8; margin-top: 2px; font-family: monospace; }
        
        /* Botón Pro para Ocultar/Mostrar Código */
        .toggle-btn {
            background-color: var(--btn-bg);
            color: var(--text);
            border: 1px solid #475569;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .toggle-btn:hover { background-color: var(--btn-hover); }

        .workspace { display: flex; flex: 1; height: 100%; }
        
        /* Panel del Editor */
        #editor-pane { flex: 1; border-right: 2px solid #334155; display: flex; flex-direction: column; }
        #monaco-container { flex: 1; width: 100%; }
        
        /* Panel del Diagrama */
        #preview-pane { flex: 1; background-color: #ffffff; display: flex; justify-content: center; align-items: center; position: relative; overflow: auto; }
        #diagram-output { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; padding: 20px;}
        #error-overlay { position: absolute; bottom: 20px; left: 20px; right: 20px; background-color: #ef4444; color: white; padding: 10px; border-radius: 6px; font-size: 12px; font-family: monospace; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="title">ConsDev Lab: SQL to ER Diagram</div>
            <div class="status" id="status">Iniciando motor...</div>
        </div>
        <button class="toggle-btn" id="toggle-code-btn" onclick="toggleCodeVisibility()">Ocultar Código</button>
    </div>

    <div class="workspace">
        <div id="editor-pane">
            <div id="monaco-container"></div>
        </div>
        <div id="preview-pane">
            <div id="diagram-output"></div>
            <div id="error-overlay"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@9.4.3/dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>

    <script>
        let editor;
        const diagramOutput = document.getElementById('diagram-output');
        const errorOverlay = document.getElementById('error-overlay');
        const statusLabel = document.getElementById('status');
        const toggleBtn = document.getElementById('toggle-code-btn');
        const editorPane = document.getElementById('editor-pane');

        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            
            editor = monaco.editor.create(document.getElementById('monaco-container'), {
                value: "-- Cargando editor...",
                language: 'sql',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 14
            });

            async function fetchSource() {
                const params = new URLSearchParams(window.location.search);
                const sourceFile = params.get('file');
                const hideCodeParam = params.get('hideCode');

                // Aplicar visibilidad inicial por URL antes de cargar el contenido
                if (hideCodeParam === 'true') {
                    editorPane.style.display = 'none';
                    toggleBtn.innerText = 'Ver Código';
                }

                if (!sourceFile) {
                    editor.setValue("CREATE TABLE EJEMPLO (\n    ID INT PRIMARY KEY,\n    Nombre VARCHAR(100)\n);");
                    statusLabel.innerText = "Modo local: Listo.";
                    updateDiagram();
                    return;
                }

                try {
                    statusLabel.innerText = "Conectando con archivo...";
                    const response = await fetch(sourceFile + '?t=' + Date.now());
                    if (!response.ok) throw new Error("Archivo no encontrado");
                    
                    const text = await response.text();
                    editor.setValue(text);
                    statusLabel.innerText = "● Archivo sincronizado";
                    statusLabel.style.color = "#4ade80"; 
                } catch (error) {
                    editor.setValue("-- Error al cargar el archivo de Github.");
                    statusLabel.innerText = "⚠️ Error de sincronización";
                    statusLabel.style.color = "#f87171"; 
                }
                updateDiagram();
            }

            fetchSource();

            let timeout;
            editor.onDidChangeModelContent(() => {
                clearTimeout(timeout);
                timeout = setTimeout(updateDiagram, 600);
            });
        });

        // ===================================================
        // NUEVO TRADUCTOR: GENERADOR DE erDiagram NATIVO
        // ===================================================
        function sqlToMermaid(sql) {
            let mermaidCode = "erDiagram\n\n";
            let relationships = ""; 
            
            const lines = sql.split(/\r?\n/);
            let inTable = false;
            let currentTable = "";
            let foundTables = false;

            for (let line of lines) {
                line = line.trim();
                if (!line || line.startsWith('--')) continue;

                // Capturar inicio de tabla
                const createMatch = line.match(/CREATE\s+TABLE\s+([a-zA-Z0-9_]+)/i);
                if (createMatch) {
                    inTable = true;
                    foundTables = true;
                    currentTable = createMatch[1]; 
                    mermaidCode += `    ${currentTable} {\n`;
                    continue;
                }

                // Capturar fin de tabla
                if (inTable && line.startsWith(')')) {
                    inTable = false;
                    mermaidCode += `    }\n\n`;
                    continue;
                }

                // Procesar campos internos
                if (inTable) {
                    if (line === '(') continue; 
                    
                    let col = line.replace(/,$/, '').trim(); 
                    col = col.replace(/\s*\(\s*(\d+)\s*\)/g, '($1)');
                    const upperCol = col.toUpperCase();

                    // --- NUEVA LÓGICA DE CARDINALIDAD ---
                    const refMatch = col.match(/REFERENCES\s+([a-zA-Z0-9_]+)/i);
                    if (refMatch) {
                        const targetTable = refMatch[1];
                        
                        // Si la columna es UNIQUE y FK al mismo tiempo = Uno a Uno
                        if (upperCol.includes("UNIQUE")) {
                            relationships += `    ${currentTable} ||--|| ${targetTable} : ""\n`;
                        } 
                        // Si solo es FK = Muchos a Uno (Pata de gallo)
                        else {
                            relationships += `    ${currentTable} }o--|| ${targetTable} : ""\n`;
                        }
                    }

                    // Ignorar restricciones declaradas al final de la tabla
                    if (/^(CONSTRAINT|FOREIGN\s+KEY|PRIMARY\s+KEY|UNIQUE\s*\(|CHECK\s*\()/i.test(col)) {
                        continue; 
                    }

                    // PROCESAR COLUMNAS NORMALES
                    const parts = col.split(/\s+/);
                    if (parts.length >= 2) {
                        const colName = parts[0];
                        let colType = parts[1].replace(/\(\d+\)/g, ''); 

                        let key = "";
                        if (upperCol.includes("PRIMARY KEY")) key = "PK";
                        else if (upperCol.includes("FOREIGN KEY") || upperCol.includes("REFERENCES")) key = "FK";
                        else if (upperCol.includes("UNIQUE")) key = "UK"; 

                        mermaidCode += `        ${colType} ${colName} ${key}\n`;
                    }
                }
            }

            if (!foundTables) return "erDiagram\n    ERROR {\n        string Escribe_SQL_valido\n    }";
            
            return mermaidCode + relationships; 
        }

        // Renderizador Robusto v9
        function updateDiagram() {
            const sqlCode = editor.getValue();
            const mermaidCode = sqlToMermaid(sqlCode);
            
            console.log("=== CÓDIGO MERMAID ER GENERADO ===");
            console.log(mermaidCode);

            diagramOutput.innerHTML = '';
            
            try {
                mermaid.mermaidAPI.render('mermaid-svg-temp', mermaidCode, function(svgCode) {
                    diagramOutput.innerHTML = svgCode;
                    errorOverlay.style.display = 'none';
                });
            } catch (err) {
                errorOverlay.innerText = "Error de sintaxis SQL. Esperando código completo...";
                errorOverlay.style.display = 'block';
                const ghostNode = document.getElementById('mermaid-svg-temp');
                if(ghostNode) ghostNode.remove();
            }
        }

        // ===================================================
        // INTERACCIÓN DE INTERFAZ: MOSTRAR / OCULTAR CÓDIGO
        // ===================================================
        function toggleCodeVisibility() {
            if (editorPane.style.display === 'none') {
                editorPane.style.display = 'flex';
                toggleBtn.innerText = 'Ocultar Código';
                // Obligar a Monaco a recalcular su tamaño al volver a ser visible
                if (editor) editor.layout(); 
            } else {
                editorPane.style.display = 'none';
                toggleBtn.innerText = 'Ver Código';
            }
        }
    </script>
</body>
</html>
