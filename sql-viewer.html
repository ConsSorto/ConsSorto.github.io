<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsDev Lab - SQL a Diagrama</title>
    <style>
        :root { --bg-dark: #0f172a; --panel-bg: #1e293b; --text: #f1f5f9; --accent: #a78bfa;}
        body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
        .header { background-color: var(--panel-bg); padding: 10px 20px; border-bottom: 1px solid #334155; }
        .title { font-size: 14px; font-weight: bold; color: var(--accent); text-transform: uppercase; }
        .status { font-size: 11px; color: #94a3b8; margin-top: 2px; font-family: monospace; }
        .workspace { display: flex; flex: 1; height: 100%; }
        #editor-pane { flex: 1; border-right: 2px solid #334155; display: flex; flex-direction: column; }
        #monaco-container { flex: 1; width: 100%; }
        #preview-pane { flex: 1; background-color: #ffffff; display: flex; justify-content: center; align-items: center; position: relative; overflow: auto; }
        #diagram-output { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; padding: 20px;}
        #error-overlay { position: absolute; bottom: 20px; left: 20px; right: 20px; background-color: #ef4444; color: white; padding: 10px; border-radius: 6px; font-size: 12px; font-family: monospace; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="title">ConsDev Lab: SQL to ER Diagram</div>
            <div class="status" id="status">Iniciando motor...</div>
        </div>
    </div>

    <div class="workspace">
        <div id="editor-pane">
            <div id="monaco-container"></div>
        </div>
        <div id="preview-pane">
            <div id="diagram-output"></div>
            <div id="error-overlay"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mermaid@10dist/mermaid.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>


    <script>
        let editor;
        const diagramOutput = document.getElementById('diagram-output');
        const errorOverlay = document.getElementById('error-overlay');
        const statusLabel = document.getElementById('status');

        mermaid.initialize({ startOnLoad: false, 
            theme: 'default',
            securityLevel: 'loose'});

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            
            // 1. INICIALIZAR MONACO DE INMEDIATO (Igual que en compilerc.html)
            editor = monaco.editor.create(document.getElementById('monaco-container'), {
                value: "-- Cargando editor...",
                language: 'sql',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 14
            });

            // 2. FUNCIÓN PARA OBTENER EL ARCHIVO ASÍNCRONAMENTE
            async function fetchSource() {
                const params = new URLSearchParams(window.location.search);
                const sourceFile = params.get('file');

                if (!sourceFile) {
                    editor.setValue("CREATE TABLE CARRERAS (\n    ID_Carrera INT PRIMARY KEY,\n    Nombre VARCHAR(100)\n);\n\n-- Escribe aquí tus tablas SQL");
                    statusLabel.innerText = "Modo local: Listo.";
                    updateDiagram();
                    return;
                }

                try {
                    statusLabel.innerText = "Conectando con archivo...";
                    // Usamos Date.now() para evitar caché igual que en tu compilador
                    const response = await fetch(sourceFile + '?t=' + Date.now());
                    
                    if (!response.ok) throw new Error("Archivo no encontrado");
                    
                    const text = await response.text();
                    editor.setValue(text);
                    statusLabel.innerText = "● Archivo sincronizado";
                    statusLabel.style.color = "#4ade80"; // Verde
                } catch (error) {
                    // Si falla, no se traba, carga un texto base
                    editor.setValue("-- Error al cargar desde GitHub.\n-- Revisa la URL Raw.\n\nCREATE TABLE ERROR_DE_RED (\n    ID INT PRIMARY KEY\n);");
                    statusLabel.innerText = "⚠️ Error de sincronización";
                    statusLabel.style.color = "#f87171"; // Rojo
                }
                updateDiagram();
            }

            // Ejecutamos la búsqueda del archivo
            fetchSource();

            // 3. LISTENERS
            let timeout;
            editor.onDidChangeModelContent(() => {
                clearTimeout(timeout);
                timeout = setTimeout(updateDiagram, 600);
            });
        });


        // ==========================================
        // TRADUCTOR DE SQL A MERMAID (Línea por línea)
        // ==========================================
        function sqlToMermaid(sql) {
            let mermaidCode = "classDiagram\n    direction LR\n\n";
            let inTable = false;
            let foundTables = false;

            // Separamos por saltos de línea (soporta Windows y Linux)
            const lines = sql.split(/\r?\n/);

            for (let line of lines) {
                line = line.trim();
                
                // Ignorar líneas vacías o comentarios
                if (!line || line.startsWith('--')) continue;

                // Detectar inicio de tabla: "CREATE TABLE Nombre"
                const createMatch = line.match(/CREATE\s+TABLE\s+([a-zA-Z0-9_]+)/i);
                if (createMatch) {
                    inTable = true;
                    foundTables = true;
                    mermaidCode += `    class ${createMatch[1]} {\n`;
                    continue;
                }

                // Detectar fin de tabla (una línea que empieza con paréntesis de cierre)
                if (inTable && line.startsWith(')')) {
                    inTable = false;
                    mermaidCode += `    }\n\n`;
                    continue;
                }

                // Procesar columnas dentro de la tabla
                if (inTable) {
                    if (line === '(') continue; // Ignorar paréntesis de apertura sueltos

                    let col = line.replace(/,$/, '').trim(); // Quitar la coma al final si existe
                    
                    const parts = col.split(/\s+/);
                    if (parts.length >= 2) {
                        const colName = parts[0];
                        const colType = parts[1]; // ej: VARCHAR(100)

                        let constraint = "-";
                        const upperLine = col.toUpperCase();
                        if (upperLine.includes("PRIMARY KEY")) constraint = "PK";
                        else if (upperLine.includes("UNIQUE")) constraint = "Unique";
                        else if (upperLine.includes("FOREIGN KEY")) constraint = "FK";

                        mermaidCode += `        ${constraint} ${colName} : ${colType}\n`;
                    }
                }
            }

            if (!foundTables) {
                return "classDiagram\n    class Info {\n        Escribe_un_CREATE_TABLE_valido\n    }";
            }

            return mermaidCode;
        }

        async function updateDiagram() {
            const sqlCode = editor.getValue();
            const mermaidCode = sqlToMermaid(sqlCode);
            
            console.log("=== 1. CÓDIGO SQL LEÍDO ===");
            console.log(sqlCode);
            console.log("=== 2. CÓDIGO MERMAID GENERADO ===");
            console.log(mermaidCode);

            diagramOutput.innerHTML = '';
            
            const graphContainer = document.createElement('pre');
            graphContainer.className = 'mermaid';
            
            graphContainer.textContent = mermaidCode; 
            diagramOutput.appendChild(graphContainer);            

            try {
                if (mermaid.run) {
                    await mermaid.run({ nodes: [graphContainer] });
                } else {
                    mermaid.init(undefined, graphContainer);
                }
                
                errorOverlay.style.display = 'none';
            } catch (err) {
                console.error("=== 3. ERROR DE PARSEO EN MERMAID ===", err);
                errorOverlay.innerText = "Error de sintaxis en el diagrama. Verifica el SQL.";
                errorOverlay.style.display = 'block';

                diagramOutput.innerHTML = "";
            }
        }
    </script>
</body>
</html>
