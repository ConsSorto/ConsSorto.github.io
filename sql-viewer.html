<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConsDev Lab - SQL a Diagrama</title>
    <style>
        :root { --bg-dark: #0f172a; --panel-bg: #1e293b; --text: #f1f5f9; --accent: #a78bfa;}
        body, html { margin: 0; padding: 0; height: 100%; font-family: system-ui, sans-serif; background-color: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }
        .header { background-color: var(--panel-bg); padding: 10px 20px; border-bottom: 1px solid #334155; }
        .title { font-size: 14px; font-weight: bold; color: var(--accent); text-transform: uppercase; }
        .status { font-size: 11px; color: #94a3b8; margin-top: 2px; font-family: monospace; }
        .workspace { display: flex; flex: 1; height: 100%; }
        #editor-pane { flex: 1; border-right: 2px solid #334155; display: flex; flex-direction: column; }
        #monaco-container { flex: 1; width: 100%; }
        #preview-pane { flex: 1; background-color: #ffffff; display: flex; justify-content: center; align-items: center; position: relative; overflow: auto; }
        #diagram-output { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; padding: 20px;}
        #error-overlay { position: absolute; bottom: 20px; left: 20px; right: 20px; background-color: #ef4444; color: white; padding: 10px; border-radius: 6px; font-size: 12px; font-family: monospace; display: none; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="title">ConsDev Lab: SQL to ER Diagram</div>
            <div class="status" id="status">Iniciando motor...</div>
        </div>
    </div>

    <div class="workspace">
        <div id="editor-pane">
            <div id="monaco-container"></div>
        </div>
        <div id="preview-pane">
            <div id="diagram-output"></div>
            <div id="error-overlay"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

    <script>
        let editor;
        const diagramOutput = document.getElementById('diagram-output');
        const errorOverlay = document.getElementById('error-overlay');
        const statusLabel = document.getElementById('status');

        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs' }});
        require(['vs/editor/editor.main'], function() {
            
            // 1. INICIALIZAR MONACO DE INMEDIATO (Igual que en compilerc.html)
            editor = monaco.editor.create(document.getElementById('monaco-container'), {
                value: "-- Cargando editor...",
                language: 'sql',
                theme: 'vs-dark',
                automaticLayout: true,
                minimap: { enabled: false },
                fontSize: 14
            });

            // 2. FUNCIÓN PARA OBTENER EL ARCHIVO ASÍNCRONAMENTE
            async function fetchSource() {
                const params = new URLSearchParams(window.location.search);
                const sourceFile = params.get('file');

                if (!sourceFile) {
                    editor.setValue("CREATE TABLE CARRERAS (\n    ID_Carrera INT PRIMARY KEY,\n    Nombre VARCHAR(100)\n);\n\n-- Escribe aquí tus tablas SQL");
                    statusLabel.innerText = "Modo local: Listo.";
                    updateDiagram();
                    return;
                }

                try {
                    statusLabel.innerText = "Conectando con archivo...";
                    // Usamos Date.now() para evitar caché igual que en tu compilador
                    const response = await fetch(sourceFile + '?t=' + Date.now());
                    
                    if (!response.ok) throw new Error("Archivo no encontrado");
                    
                    const text = await response.text();
                    editor.setValue(text);
                    statusLabel.innerText = "● Archivo sincronizado";
                    statusLabel.style.color = "#4ade80"; // Verde
                } catch (error) {
                    // Si falla, no se traba, carga un texto base
                    editor.setValue("-- Error al cargar desde GitHub.\n-- Revisa la URL Raw.\n\nCREATE TABLE ERROR_DE_RED (\n    ID INT PRIMARY KEY\n);");
                    statusLabel.innerText = "⚠️ Error de sincronización";
                    statusLabel.style.color = "#f87171"; // Rojo
                }
                updateDiagram();
            }

            // Ejecutamos la búsqueda del archivo
            fetchSource();

            // 3. LISTENERS
            let timeout;
            editor.onDidChangeModelContent(() => {
                clearTimeout(timeout);
                timeout = setTimeout(updateDiagram, 600);
            });
        });

        // ==========================================
        // TRADUCTOR DE SQL A MERMAID 
        // ==========================================
        function sqlToMermaid(sql) {
            let mermaidCode = "classDiagram\n    direction LR\n\n";
            const tableRegex = /CREATE\s+TABLE\s+(\w+)\s*\(([\s\S]*?)\);/gi;
            let match;
            let foundTables = false;

            while ((match = tableRegex.exec(sql)) !== null) {
                foundTables = true;
                const tableName = match[1];      
                const columnsText = match[2];    
                mermaidCode += `    class ${tableName} {\n`;

                // Uso de /\r?\n/ para soportar archivos creados en Windows y Linux
                const lines = columnsText.split(/\r?\n/); 
                for (let line of lines) {
                    let col = line.trim();
                    if (col.endsWith(',')) col = col.slice(0, -1);
                    if (!col) continue; 
                    
                    const parts = col.split(/\s+/); 
                    if (parts.length >= 2) {
                        const colName = parts[0];
                        const colType = parts[1];
                        
                        let constraint = "-";
                        if (col.toUpperCase().includes("PRIMARY KEY")) constraint = "PK";
                        else if (col.toUpperCase().includes("UNIQUE")) constraint = "Unique";
                        else if (col.toUpperCase().includes("FOREIGN KEY")) constraint = "FK"; 
                        
                        mermaidCode += `        ${constraint} ${colName} : ${colType}\n`;
                    }
                }
                mermaidCode += `    }\n\n`;
            }

            if (!foundTables) {
                return "classDiagram\n    class Esperando_Codigo {\n        Escribe un CREATE TABLE para ver el diagrama\n    }";
            }

            return mermaidCode;
        }

        async function updateDiagram() {
            const sqlCode = editor.getValue();
            const mermaidCode = sqlToMermaid(sqlCode);
            try {
                const { svg } = await mermaid.render('mermaid-svg', mermaidCode);
                diagramOutput.innerHTML = svg;
                errorOverlay.style.display = 'none';
            } catch (err) {
                errorOverlay.innerText = "Error en la sintaxis SQL o tabla incompleta...";
                errorOverlay.style.display = 'block';
                const ghostNode = document.getElementById('mermaid-svg');
                if(ghostNode) ghostNode.remove();
            }
        }
    </script>
</body>
</html>
